</text>
<text x="1196" y="790.4" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700">
<tspan x="1196" dy="0">Processor → router → protocol parsers</tspan>
</text>
<text x="1196" y="829.24" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="1196" dy="0">Dispatch top-level instructions and CPI calls</tspan>
<tspan x="1196" dy="29.900000000000002">Carbon decodes instruction bytes + arranged accounts</tspan>
<tspan x="1196" dy="29.900000000000002">Invocation-aware execution matching where supported</tspan>
</text>
<polyline points="710,810 790,810" fill="none" stroke="#167f76" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
