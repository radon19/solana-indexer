<text x="1430" y="1567.72" fill="#aa742a" font-family="Liberation Sans,Arial,sans-serif" font-size="19">
<tspan x="1430" dy="0">permanent write failure</tspan>
</text>
<polyline points="1620,1725 1740,1725" fill="none" stroke="#aa742a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="1629" y="1759.96" fill="#aa742a" font-family="Liberation Sans,Arial,sans-serif" font-size="17">
<tspan x="1629" dy="0">manual</tspan>
</text>
<text x="1629" y="1781.96" fill="#aa742a" font-family="Liberation Sans,Arial,sans-serif" font-size="17">
<tspan x="1629" dy="0">replay</tspan>
</text>
<rect x="90" y="1310" width="1000" height="480" rx="18" fill="#ffffff" stroke="#b9afcc" stroke-width="2"/>
<text x="120" y="1356.36" fill="#7953bc" font-family="Liberation Sans,Arial,sans-serif" font-size="22" font-weight="700">
<tspan x="120" dy="0">ENGINEERING FEATURES</tspan>
</text>
<text x="120" y="1411.12" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="700">
<tspan x="120" dy="0">CPI-aware event identity</tspan>
</text>
<text x="120" y="1448.36" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="22">
<tspan x="120" dy="0">Parent + local instruction indexes</tspan>
<tspan x="120" dy="28.6">keep repeated calls distinct.</tspan>
</text>
<text x="615" y="1411.12" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="700">
<tspan x="615" dy="0">Precise unsigned storage</tspan>
</text>
<text x="615" y="1448.36" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="22">
<tspan x="615" dy="0">u64 amounts use NUMERIC(20,0).</tspan>
<tspan x="615" dy="28.6">No signed integer wraparound.</tspan>
</text>
<text x="120" y="1541.12" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="700">
<tspan x="120" dy="0">Bounded async stages</tspan>
</text>
<text x="120" y="1578.36" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="22">
<tspan x="120" dy="0">Tokio tasks + channel backpressure</tspan>
<tspan x="120" dy="28.6">protect queued work under load.</tspan>
</text>
<text x="615" y="1541.12" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="700">
<tspan x="615" dy="0">Graceful shutdown</tspan>
</text>
<text x="615" y="1578.36" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="22">
<tspan x="615" dy="0">SIGINT / SIGTERM: stop input,</tspan>
<tspan x="615" dy="28.6">drain queues, then finish writes.</tspan>
</text>
<text x="120" y="1671.12" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="700">
<tspan x="120" dy="0">Reproducible verification</tspan>
</text>
<text x="120" y="1708.36" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="22">
<tspan x="120" dy="0">Unit fixtures + capture replay +</tspan>
<tspan x="120" dy="28.6">PostgreSQL regression checks.</tspan>
</text>
<text x="615" y="1671.12" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="700">
<tspan x="615" dy="0">Replay-safe persistence</tspan>
</text>
<text x="615" y="1708.36" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="22">
<tspan x="615" dy="0">Idempotent event keys + DLQ</tspan>
<tspan x="615" dy="28.6">recovery support safe retries.</tspan>
</text>
