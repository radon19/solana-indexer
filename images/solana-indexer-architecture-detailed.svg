<text x="116" y="790.4" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700">
<tspan x="116" dy="0">Ingest + normalize</tspan>
</text>
<text x="116" y="829.24" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="116" dy="0">Resolve account keys and instruction indexes</tspan>
<tspan x="116" dy="29.900000000000002">Normalize transaction / account / block data</tspan>
<tspan x="116" dy="29.900000000000002">Live: validate complete finalized blocks</tspan>
</text>
<rect x="790" y="715" width="300" height="190" rx="18" fill="#f4f3ef" stroke="#526174" stroke-width="2"/>
<text x="816" y="748.84" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700">
<tspan x="816" dy="0">PIPELINE 02</tspan>
</text>
<text x="816" y="790.4" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700">
<tspan x="816" dy="0">Bounded queue</tspan>
</text>
<text x="816" y="829.24" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="816" dy="0">Tokio mpsc</tspan>
<tspan x="816" dy="29.900000000000002">Backpressure</tspan>
<tspan x="816" dy="29.900000000000002">Accepted work retained</tspan>
</text>
<rect x="1170" y="715" width="1120" height="330" rx="18" fill="#f1edfa" stroke="#7953bc" stroke-width="2"/>
