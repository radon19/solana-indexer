</text>
<text x="1196" y="984.24" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="1196" dy="0">Jupiter  ·  Pump.fun  ·  PumpSwap  ·  Raydium CLMM / CPMM / AMM v4</tspan>
<tspan x="1196" dy="29.900000000000002">Orca Whirlpool  ·  Meteora DLMM / DAMM v2 / DBC</tspan>
</text>
<rect x="1170" y="1110" width="1120" height="140" rx="18" fill="#f1edfa" stroke="#7953bc" stroke-width="2"/>
