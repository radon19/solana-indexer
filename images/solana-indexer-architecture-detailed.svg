<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2030" viewBox="0 0 2400 2030">
<title>Solana Indexer — architecture and features</title>
<desc>Live Yellowstone gRPC, optional local validator with Geyser, and offline capture replay feed normalization, bounded queues, Carbon parsers, formatted output, batched PostgreSQL writes and finalized checkpoints. Includes DLQ and graceful shutdown.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs>
