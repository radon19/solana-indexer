</text>
<text x="1196" y="1185.4" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700">
<tspan x="1196" dy="0">Typed events</tspan>
</text>
<text x="1196" y="1224.24" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="1196" dy="0">Swap  ·  Trade  ·  Route hops  ·  Liquidity add/remove  ·  Pool create  ·  Launch</tspan>
</text>
<polyline points="1730,1045 1730,1110" fill="none" stroke="#7953bc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="980" width="1000" height="275" rx="18" fill="#ffffff" stroke="#aac7c1" stroke-width="2"/>
<text x="120" y="1025.48" fill="#167f76" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700">
<tspan x="120" dy="0">FINALIZED-SLOT INTEGRITY</tspan>
</text>
<text x="120" y="1075.64" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="28" font-weight="700">
<tspan x="120" dy="0">Complete block envelope → validate → parse → write</tspan>
</text>
<text x="120" y="1122.12" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="24">
<tspan x="120" dy="0">• Follow the parent slot + block hash chain</tspan>
<tspan x="120" dy="31.200000000000003">• Keep the complete slot together through storage</tspan>
<tspan x="120" dy="31.200000000000003">• Ordinary slot notifications do not advance checkpoints</tspan>
<tspan x="120" dy="31.200000000000003">• Offline capture replay creates no live resume checkpoints</tspan>
</text>
<rect x="1170" y="1340" width="450" height="200" rx="18" fill="#eef7f5" stroke="#167f76" stroke-width="2"/>
<text x="1196" y="1373.84" fill="#167f76" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700">
<tspan x="1196" dy="0">OUTPUT A · OPTIONAL</tspan>
</text>
<text x="1196" y="1415.4" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700">
<tspan x="1196" dy="0">Terminal formatter</tspan>
</text>
<text x="1196" y="1454.24" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="1196" dy="0">PRINT_EVENTS=1</tspan>
<tspan x="1196" dy="29.900000000000002">Readable events + mint references</tspan>
<tspan x="1196" dy="29.900000000000002">Exact integer amount formatting</tspan>
</text>
<rect x="1740" y="1340" width="550" height="200" rx="18" fill="#eaf3fb" stroke="#3974af" stroke-width="2"/>
<text x="1766" y="1373.84" fill="#3974af" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700">
<tspan x="1766" dy="0">OUTPUT B · STORAGE</tspan>
</text>
<text x="1766" y="1415.4" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700">
<tspan x="1766" dy="0">Writer + batching</tspan>
</text>
<text x="1766" y="1454.24" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="1766" dy="0">WriteMsg → bounded queue → Batch</tspan>
<tspan x="1766" dy="29.900000000000002">Flush at 1,000 rows or 250 ms</tspan>
<tspan x="1766" dy="29.900000000000002">Complete finalized slots stay together</tspan>
</text>
<polyline points="1730,1250 1730,1290 1395,1290 1395,1340" fill="none" stroke="#167f76" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1730,1290 2015,1290 2015,1340" fill="none" stroke="#3974af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1170" y="1610" width="450" height="200" rx="18" fill="#fff4df" stroke="#aa742a" stroke-width="2"/>
<text x="1196" y="1643.84" fill="#aa742a" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700">
<tspan x="1196" dy="0">RECOVERY</tspan>
</text>
<text x="1196" y="1685.4" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700">
<tspan x="1196" dy="0">Dead-letter batches</tspan>
</text>
<text x="1196" y="1724.24" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="1196" dy="0">Durable payloads for failed writes</tspan>
<tspan x="1196" dy="29.900000000000002">Transient errors retry with backoff</tspan>
<tspan x="1196" dy="29.900000000000002">Checkpoint failures stop advancement</tspan>
</text>
<rect x="1740" y="1610" width="550" height="200" rx="18" fill="#eaf3fb" stroke="#3974af" stroke-width="2"/>
<text x="1766" y="1643.84" fill="#3974af" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700">
<tspan x="1766" dy="0">PERSISTENCE</tspan>
</text>
<text x="1766" y="1685.4" fill="#202c40" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700">
<tspan x="1766" dy="0">PostgreSQL</tspan>
</text>
<text x="1766" y="1724.24" fill="#526174" font-family="Liberation Sans,Arial,sans-serif" font-size="23">
<tspan x="1766" dy="0">Chain + accounts + transactions</tspan>
<tspan x="1766" dy="29.900000000000002">DEX events + route hops</tspan>
<tspan x="1766" dy="29.900000000000002">Data + checkpoint: one atomic commit</tspan>
</text>
<polyline points="2140,1540 2140,1610" fill="none" stroke="#3974af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1950" y="1572.6" fill="#3974af" font-family="Liberation Sans,Arial,sans-serif" font-size="20">
<tspan x="1950" dy="0">SQL transaction</tspan>
</text>
