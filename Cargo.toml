[package]
name = "solana-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
bs58 = "0.5.1"
carbon-core = "2.0.0"
carbon-jupiter-limit-order-2-decoder = "2.0.0"
carbon-jupiter-swap-decoder = "2.0.0"
carbon-meteora-damm-v2-decoder = "2.0.0"
carbon-meteora-dbc-decoder = "2.0.0"
carbon-meteora-dlmm-decoder = "2.0.0"
carbon-orca-whirlpool-decoder = "2.0.0"
carbon-pump-fees-decoder = "2.0.0"
carbon-pump-swap-decoder = "2.0.0"
carbon-pumpfun-decoder = "2.0.0"
carbon-raydium-amm-v4-decoder = "2.0.0"
carbon-raydium-clmm-decoder = "2.0.0"
carbon-raydium-cpmm-decoder = "2.0.0"
carbon-raydium-launchpad-decoder = "2.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
solana-instruction = "3.4.1"
solana-pubkey = "4.2.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "full"] }
yellowstone-grpc-client = "13.5.0"
yellowstone-grpc-proto = "12.7.0"

